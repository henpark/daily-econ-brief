name: Daily Economic Dashboard

on:
  schedule:
    # 22:35 UTC = 다음날 07:35 KST 기동.
    # GitHub Actions 크론은 정시 보장이 안 되고 5~20분 밀리는 게 정상이라 일찍 띄운다.
    # 생성이 끝나면 아래 wait 스텝이 07:50 KST 정각까지 기다렸다가 발송한다.
    - cron: "35 22 * * 0-4" # 일~목(UTC) = 월~금(KST)
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install markdown # 무료 순수 파이썬 패키지. LLM SDK는 안 씀.

      - name: Generate dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }} # 비워두면 후보 목록에서 자동 선택
        run: python generate_dashboard.py

      - name: Publish to GitHub Pages
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p docs
          cp out/index.html docs/index.html
          cp out/*.html docs/ 2>/dev/null || true
          cp out/dashboard.md docs/latest.md
          git add docs
          git commit -m "dashboard $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push

      - name: Wait until 07:50 KST
        run: |
          TARGET=$(TZ=Asia/Seoul date -d "today 07:50" +%s)
          NOW=$(date +%s)
          if [ "$TARGET" -gt "$NOW" ]; then
            SLEEP=$((TARGET - NOW))
            [ "$SLEEP" -gt 1500 ] && SLEEP=1500   # 최대 25분만 대기
            echo "${SLEEP}초 대기 후 발송"
            sleep "$SLEEP"
          else
            echo "이미 07:50 경과 → 즉시 발송"
          fi

      - name: Send to KakaoTalk
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python send_kakao.py out/kakao_summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-${{ github.run_id }}
          path: out/
          retention-days: 7
